<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>
    <style>
        html, body {
            height: 100%; /* Ensure the page uses full height */
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            flex-direction: column;
           
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 99%; /* Adjust this as needed */
            max-height: 90vh; /* Limit height to viewport height */
            overflow-y: auto; /* Allow vertical scrolling */
        }

        h1, h3 {
            text-align: center;
        }

        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 3px solid #0c0101;
            padding: 8px;
            text-align: left;
        }

        .form-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
        }

        .form-group label {
            margin-right: 10px;
            width: 150px;
            text-align: start;
        }

        .form-group input {
            padding: 8px;
            width: 30%;
            border: 1.5px solid #0c0101;
            border-radius: 4px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0c0101;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #333;
        }
    </style>
    <script>
        function validateElective() {
            const electiveInput = document.getElementById("Elective").value.trim();
            const validElectives = ["22CST641", "22CST642", "22CST643"];

            if (!validElectives.includes(electiveInput)) {
                alert("Please enter a valid elective.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Course Registration</h1>
        <h3>Department: Computer Science and Engineering</h3>
        <form action="sample1.php" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Student Name:</label>
                <input type="text" id="Student_Name" name="Student_Name" required>
            </div>
            <div class="form-group">
                <label for="usn">USN:</label>
                <input type="text" id="USN" name="USN" required>
            </div>
            <div class="form-group">
                <label for="reg-date">Registered Date:</label>
                <input type="date" id="Registered_Date" name="Registered_Date" required>
            </div>
            <table>
                <colgroup>
                    <col>
                    <col>
                    <col>
                </colgroup>
                <tr>
                    <th>Courses</th>
                    <th>Credits</th>
                    <th>Tick(&#10003;)</th>
                </tr>
                <tr>
                    <td>22CST71</td>
                    <td>3</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22CSI72</td>
                    <td>4</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22CST73</td>
                    <td>4</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22CST74X<br> 22CST741<br> 22CST742<br> 22CST743</td>
                    <td>3</td>
                    <td>
                        <input type="text" id="Elective" name="Elective" pattern="22CST641|22CST642|22CST643" 
                        required title="Please enter a valid elective code.">
                    </td>
                </tr>                                                                            
                <tr>
                    <td>22CSL75</td>
                    <td>1</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22CSL76</td>
                    <td>1</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22CSP77</td>
                    <td>1</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22CST77</td>
                    <td>2</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22UHV78</td>
                    <td>1</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>22NS79</td>
                    <td>0</td>
                    <td>&#10003;</td> 
                </tr>
                <tr>
                    <td>Total Credit</td>
                    <td>20</td>
                    <td>&#10003;</td> 
                </tr>
            </table>
            <div class="form-group">
                <label for="fileUpload">Upload Fee Receipt:</label>
                <input type="file" id="fileUpload" name="fileUpload" required>
            </div>

            <div class="form-group">
                <label for="Counsellor_Name">Counsellor Name:</label>
                <input type="text" id="Counsellor_Name" name="Counsellor_Name" required>
            </div>
            <button type="submit" name="submit">Submit Registration</button>
        </form>
    </div>
</body>
</html>
